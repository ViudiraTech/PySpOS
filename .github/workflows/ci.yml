name: CI

# 日常检查全部执行；发版与手动的全平台矩阵由 test-platforms.yml 承担。
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # 只启用抓「真 bug」的关键规则（语法错误、未定义名、遮蔽、比较陷阱）。
      # 故意不启用 F401 未用导入：main.py 是兼容 facade，重导出是有意为之，
      # 全开会产生大量误报。风格类规则留给本地按需开启。
      - name: Ruff
        run: python -m ruff check --no-cache src/ tests/ tools/ launcher.py build_update.py secure_boot.py boot_policy.py boot_keygen.py force_sync.py reset_slot.py fastboot_gui.py

  # 官网是纯静态站，没有测试框架兜底——死链、标签不配平、设计 token
  # 漂移都只能靠机器查。这里把它们变成会红的检查，而不是靠眼睛。
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Design token 对比度（WCAG AA）
        run: python tools/checks/check_tokens_contrast.py

      - name: 设计层纪律（组件无硬编码 / token 引用完整）
        run: python tools/checks/check_design_layer.py

      - name: HTML 结构 / 死链 / 锚点
        run: python tools/checks/check_docs_html.py

      - name: OTA 清单与实际文件一致
        run: python tools/checks/check_ota_manifest.py

  # ── 日常档：每次 push / PR，一格 ubuntu，最快反馈 ──────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt

      - name: Show environment
        run: |
          python -VV
          python -c "import unicorn; print('unicorn', unicorn.__version__)"

      - name: Run tests
        run: python -m pytest tests/ -q -p no:warnings
