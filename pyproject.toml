[project]
name = "pyspos"
version = "3.2.0"
description = "用 Python 写的模拟操作系统：真子进程、EEVDF 调度器、Unicorn ELF 引擎、curses 首次开机向导"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "GoutouStdio" }]
keywords = [
    "operating-system",
    "simulator",
    "elf",
    "unicorn",
    "scheduler",
    "eevdf",
    "curses",
    "educational",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: System :: Emulators",
]
dependencies = [
    "requests>=2.28",
    "unicorn>=2.0",
    "tzdata>=2023.3; platform_system != 'Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://viudiratech.rainyland.top"
Repository = "https://github.com/ViudiraTech/PySpOS"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 默认只开抓「真 bug」的关键规则。main.py 是兼容 facade，重导出是有意的，
# 全开 F401 会误报；风格类规则请按需在本地显式 --select。
select = ["E9", "F63", "F7", "F82", "F811", "F821"]
